# =================================================================================================
# logstash.conf — pipeline de ingestão (Fase 9, opcional)
# =================================================================================================
# Um pipeline do Logstash sempre tem três blocos: input (de onde os eventos vêm), filter
# (transformações opcionais no meio do caminho) e output (para onde eles vão depois).
# =================================================================================================

input {
  tcp {
    port => 5000
    # -------------------------------------------------------------------------------------------
    # codec => json_lines — TEM que bater com o formato que o cliente Java envia. O
    # LogstashTcpSocketAppender (biblioteca logstash-logback-encoder, ver
    # processo-service/pom.xml e logback-spring.xml) manda um objeto JSON completo por evento,
    # separado por quebra de linha — exatamente o que "json_lines" espera do lado de dentro do
    # Logstash. Usar só "json" (sem o "_lines") aqui faria o Logstash tentar interpretar o STREAM
    # inteiro como um único documento JSON e falhar assim que o segundo evento chegasse.
    # -------------------------------------------------------------------------------------------
    codec => json_lines
  }
}

filter {
  # Nenhum filtro necessário aqui — diferente de pipelines clássicos de log de TEXTO PURO (que
  # normalmente precisam de um filtro "grok" para EXTRAIR campos de uma linha crua com regex), o
  # LogstashEncoder do lado Java já manda o evento como JSON estruturado (timestamp, level,
  # logger_name, message, e os campos de MDC como "requestId" — ver RequestIdFilter.java —, mais
  # o campo fixo "application" configurado em logback-spring.xml). O Logstash só precisa
  # encaminhar o que já chegou pronto.
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    # Um índice NOVO por dia (sufixo de data) é a convenção padrão do ecossistema ELK — facilita
    # aplicar políticas de retenção (ex.: apagar índices com mais de 30 dias) sem precisar filtrar
    # documento por documento dentro de um índice único gigante.
    index => "sgp-processos-%{+YYYY.MM.dd}"
  }

  # Espelha cada evento também no próprio log do container Logstash — útil para confirmar que o
  # pipeline está recebendo dado (via "docker-compose logs -f logstash") sem precisar abrir o
  # Kibana toda vez que estiver testando a conexão.
  stdout {
    codec => rubydebug
  }
}
